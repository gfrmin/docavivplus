name: deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Daily rebuild so the build-time "upcoming screenings" list stays current
  # during the festival even without a code change. 03:00 UTC ~ 06:00 Israel.
  schedule:
    - cron: "0 3 * * *"

jobs:
  deploy:
    # The recipe lives in site-kit so it is fixed in one place for every site.
    # This repo's SHA-pinned actions and deploy concurrency group are now the
    # fleet default, having started here.
    uses: gfrmin/site-kit/.github/workflows/worker-deploy.yml@master
    with:
      build: npm run build
      # Astro 4 needs Node >= 21; 24 is the fleet pin, set in site-kit.
      node: "24"
    secrets: inherit
